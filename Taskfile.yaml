version: "3"
env:
  CURRENT_HOST:
    # sh: echo "$HOST"
    sh: cat /etc/hostname
tasks:
  get:nixos-wsl:
    desc: Get NixOS for WSL
    dir: ./tmp/
    cmds:
      - echo "Getting NixOS for WSL..."
      - wget https://github.com/nix-community/NixOS-WSL/releases/download/2505.7.0/nixos.wsl
      - wget https://github.com/nix-community/NixOS-WSL/releases/download/2505.7.0/nixos.wsl.sha256
  nix-channel:
    dir: ./etc/nixos/
    vars:
      NIX_CHANNEL_VERSION: "25.11"
    cmds:
      - sudo nix-channel --list
      # github:NixOS/nixpkgs/nixos-25.11
      - sudo nix-channel --add 'https://nixos.org/channels/nixos-{{.NIX_CHANNEL_VERSION}}' nixos
      # github:nix-community/nixos-wsl/release-25.11
      - sudo nix-channel --add 'https://github.com/nix-community/NixOS-WSL/archive/refs/heads/release-{{.NIX_CHANNEL_VERSION}}.tar.gz' nixos-wsl
      # - nix flake update
      - sudo nix-channel --update
      - sudo nixos-rebuild switch
  install:dotfiles:
    cmds:
      - cd ~ && git clone https://github.com/lucasfcnunes/dotfiles.git
      - sudo rm -rf /etc/nixos/ && sudo ln -s ~/dotfiles/etc/nixos/ /etc/nixos
  flake:update:
    dir: ./etc/nixos/
    sources:
      - ./flake.nix
    cmds:
      - nix flake update
      - task: nix-patcher
  switch:
    aliases:
      - rebuild
    # deps:
    #   - flake:update
    cmds:
      - sudo nix-shell --extra-experimental-features 'nix-command flakes' --run 'nixos-rebuild switch' --packages git vim go-task
  rollback:
    interactive: true
    cmds:
      - sudo nix-env --list-generations --profile /nix/var/nix/profiles/system
      - |
        read -p "Would you really like to rollback to a previous generation? (Ctrl+C to cancel)"
        sudo nix-env --rollback --profile /nix/var/nix/profiles/system
  ssh:cmd:
    desc: SSH into the host using the SSH config file
    dir: ./etc/nixos/
    vars:
      HOST: "{{.HOST | default .CURRENT_HOST}}"
      SSH_FLAGS: '{{.SSH_FLAGS | default "-F /mnt/c/Users/lucas/.ssh/config"}}'
      DEFAULT_CMD: |-
        {{- if ne .HOST .CURRENT_HOST -}}
        ssh {{.SSH_FLAGS}} '{{.HOST}}' --
        {{- end -}}
    cmds:
      - >-
        {{.DEFAULT_CMD}} {{.CLI_ARGS}}
  flake:eval:
    dir: ./etc/nixos/
    vars:
      HOST: '{{.HOST| default "nixos-01"}}'
      NIX_CONFIG_EXAMPLE: virtualisation.containerd
      NIX_CONFIG: "{{.NIX_CONFIG | default .NIX_CONFIG_EXAMPLE}}"
      FORMAT: '{{.FORMAT | default "--json | yq -P"}}'
    cmds:
      # - nix-shell --extra-experimental-features 'nix-command flakes' --run 'nix eval .#nixosConfigurations."{{.HOST}}".config --json | yq -r "..|strings?" | grep {{.GREP_PATTERN}}' --packages git vim go-task
      # - nix run github:zimbatm/nix-flake-grep -- virtualisation.containerd
      - nix eval .#nixosConfigurations.'{{.HOST}}'.config.{{.NIX_CONFIG}} {{.FORMAT}}
  nixos-anywhere:
    desc: Deploy NixOS using NixOS Anywhere
    dir: ./etc/nixos/
    vars:
      HOST: "{{.HOST}}"
      TARGET_HOST: "{{.TARGET_HOST | default .HOST}}"
    cmds:
      - nix run github:nix-community/nixos-anywhere -- --flake '.#{{.HOST}}' --target-host '{{.TARGET_HOST}}'
  deploy:
    desc: Deploy NixOS using deploy-rs
    dir: ./etc/nixos/
    vars:
      HOST: '{{.HOST | default "nixos-01"}}'
    cmds:
      - nix run github:serokell/deploy-rs -- .#{{.HOST}}.system --skip-checks --rollback-succeeded false
  ssh-to-age:
    desc: Get the public key of the SSH host key in age format, so it can be added to the SOPS keys for encryption
    cmds:
      - task: ssh:cmd
        vars:
          CLI_ARGS: cat /etc/ssh/ssh_host_ed25519_key.pub | nix run nixpkgs#ssh-to-age
  cp:kubeconfig:
    desc: Copy kubeconfig from nixos-01 to local machine
    dir: ~/.kube/nixos-01/
    cmds:
      - scp root@nixos-01:/etc/kubernetes/cluster-admin.kubeconfig ./kubeconfig
      - sed -i 's/\/var\/lib\/kubernetes\/secrets/./g' ./kubeconfig
      - scp root@nixos-01:/var/lib/kubernetes/secrets/{ca,cluster-admin,cluster-admin-key}.pem ./
  facter:
    desc: Generate facter.json using nixos-facter
    dir: ./etc/nixos/
    cmds:
      - task: ssh:cmd
        vars:
          CLI_ARGS: sudo nix run nixpkgs#nixos-facter > './modules/hosts/{{.HOST}}/facter.json'
  disko:
    desc: Get information about disks using disko
    dir: ./etc/nixos/
    vars:
      HOST: "{{.HOST | default .CURRENT_HOST}}"
    cmds:
      - nix run github:nix-community/disko -- --flake '.#{{.HOST}}' --dry-run
  nix-patcher:
    desc: Apply patches using nix-patcher
    dir: ./etc/nixos/
    cmds:
      # - nix run github:katrinafyi/nix-patcher -- --update --verbose
      # - nix run ~/dotfiles/lucasfcnunes/nix-patcher/ -- --update --verbose
      - nix run github:lucasfcnunes/nix-patcher -- --update --verbose
  gpu-pv-drivers:sync:
    desc: Install GPU-PV driver for WSL
    dir: "{{.WSL_DRIVERS_PATH}}"
    # dir: /usr/lib/wsl/drivers/
    # dir: /mnt/c/Windows/System32/DriverStore/FileRepository/
    # wslpath 'C:\Windows\System32\DriverStore\FileRepository\'
    vars:
      WSL_DRIVERS_PATH: /usr/lib/wsl/drivers/
      HOST: '{{.HOST | default "dkplucasfcnunes"}}'
      AMD_REPO: u0201588.inf_amd64_18d847f3215007c5
      NVIDIA_REPO: nv_dispsi.inf_amd64_adf52f3aa9d98326
    cmds:
      - rsync -avm --mkpath --include={'*/','{{.AMD_REPO}}/**.bin*','{{.AMD_REPO}}/**.so*'} --exclude={'*'} ./ 'root@{{.HOST}}:{{.WSL_DRIVERS_PATH}}'
      # - scp ./{{.AMD_REPO}}/*.{so,bin} 'root@{{.HOST}}:{{.WSL_DRIVERS_PATH}}/'
      # - scp ./{{.NVIDIA_REPO}}/*.{so,bin} 'root@{{.HOST}}:{{.WSL_DRIVERS_PATH}}'
