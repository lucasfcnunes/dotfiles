# TODO: change to a better name
name: containers
volumes:
  nzbhydra2-data:
  jackett-data:
services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    container_name: nzbhydra2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - nzbhydra2-data:/config/
      - /mnt/m/TORRENT/:/downloads/
    ports:
      - 5076:5076
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - jackett-data:/config/
      - /mnt/m/TORRENT/_jacket_blackhole/:/downloads/
    ports:
      - 9117:9117
    restart: unless-stopped
